<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>다섯고개</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 40'%3E%3Cpath d='M0 40 L10 28 L18 34 L30 20 L38 28 L50 14 L58 22 L70 8 L78 16 L90 2 L100 40Z' fill='%2324577F'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one trail down the page. Brand band, status banner, action sheet, grid of player cards, event log. */
:root{
  color-scheme:light;
  --bg:#E7ECEE; --surface:#F6F9FA; --surface-2:#DAE3E7; --ink:#14222B; --ink-2:#4B5D67; --line:#BCCAD0;
  --accent:#24577F; --accent-ink:#FFFFFF; --turn:#B8790A; --turn-bg:#F3E6C8; --good:#2B7A57; --bad:#B03A2E;
  --font-display:"Black Han Sans","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1920; --surface:#152630; --surface-2:#1D323E; --ink:#E5EEF2; --ink-2:#92A8B3; --line:#2B4350;
    --accent:#7DB4E8; --accent-ink:#0E1920; --turn:#F0B429; --turn-bg:#3A3015; --good:#5CC796; --bad:#F07A6B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1920; --surface:#152630; --surface-2:#1D323E; --ink:#E5EEF2; --ink-2:#92A8B3; --line:#2B4350;
  --accent:#7DB4E8; --accent-ink:#0E1920; --turn:#F0B429; --turn-bg:#3A3015; --good:#5CC796; --bad:#F07A6B;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;
  padding-block:18px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-width:0}
h1,h2,h3{font-family:var(--font-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:20px}
h3{font-size:16px}
p{margin:0}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.brand{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.brand svg{width:96px;height:38px;flex:none}
.brand h1{font-size:40px;line-height:1}
.brand .tag{flex:1 1 220px;color:var(--ink-2);font-size:13px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.bar .brand-sm{display:flex;align-items:center;gap:10px}
.bar .brand-sm svg{width:54px;height:22px}
.bar .brand-sm b{font-family:var(--font-display);font-weight:400;font-size:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.warn{border-color:var(--bad)}
label{font-size:13px;color:var(--ink-2);font-weight:500}
.field{display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row > .grow{flex:1 1 160px;min-width:0}
input[type=text]{font:inherit;font-size:16px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-height:44px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 16px;border-radius:8px;min-height:44px}
button:hover:not(:disabled){border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button.danger{color:var(--bad);border-color:var(--bad)}
button.small{min-height:34px;padding:4px 10px;font-size:13px}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.or{display:flex;align-items:center;gap:10px;color:var(--ink-2);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.code{font-family:var(--font-display);font-size:26px;letter-spacing:.18em;padding:2px 12px;background:var(--surface-2);border-radius:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border-radius:999px;min-height:38px;padding:6px 14px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.plist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.plist li{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-width:0}
.plist .nm{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:500}
.badge{font-size:11px;padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.badge.on{background:var(--accent);color:var(--accent-ink)}
.badge.bad{background:var(--bad);color:var(--bg)}
.banner{border-radius:10px;padding:14px 16px;background:var(--surface-2);display:flex;flex-direction:column;gap:4px}
.banner.turn{background:var(--turn-bg);border:2px solid var(--turn)}
.banner.end{background:var(--accent);color:var(--accent-ink)}
.banner h2{font-size:22px}
.mine{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border:1px dashed var(--ink-2);border-radius:10px}
.mine b{font-family:var(--font-display);font-weight:400;font-size:20px;letter-spacing:.04em}
.big{font-size:18px;font-weight:700;overflow-wrap:anywhere}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.yn button{font-size:18px;font-weight:700;min-height:54px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.opts button{font-size:18px;font-weight:700;min-height:60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pcard.turn{border:2px solid var(--turn);background:var(--turn-bg)}
.pcard.out{opacity:.7;background:var(--surface-2)}
.pcard header{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pcard .nm{font-family:var(--font-display);font-size:18px;overflow-wrap:anywhere}
.pcard.out .nm{text-decoration:line-through;text-decoration-thickness:2px}
.ap{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flags{display:inline-flex;gap:3px}
.flag{width:13px;height:17px;fill:none;stroke:var(--ink-2);stroke-width:1.4}
.flag.on path:first-child{stroke:var(--ink)}
.flag.on .cloth{fill:var(--accent);stroke:var(--accent)}
.plus,.apn{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.state{font-size:13px;color:var(--ink-2)}
.clues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:11em;overflow-y:auto;font-size:13px}
.clues li{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;border-top:1px solid var(--line);padding-top:4px}
.clues .q{min-width:0;overflow-wrap:anywhere}
.pill{flex:none;font-size:12px;font-weight:700;padding:0 8px;border-radius:999px;background:var(--surface-2)}
.pill.yes{background:var(--good);color:var(--bg)}
.pill.no{background:var(--bad);color:var(--bg)}
.pill.miss{background:var(--surface-2);color:var(--bad)}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:340px;overflow-y:auto}
.log li{font-size:14px;padding:6px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.log li.sys{color:var(--ink-2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:20;max-width:calc(100vw - 32px)}
details summary{cursor:pointer;font-weight:700}
details ul{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
@media (max-width:480px){.brand h1{font-size:34px}.grid{grid-template-columns:1fr}}
</style>
</head>

  window.__fiveLoadFail = function () { if (!window.__fiveStarted && location.protocol !== 'file:') a.innerHTML = failMsg; };
})();
</script>

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function genCode() { var al = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789', s = ''; for (var i = 0; i < 4; i++) s += al[Math.floor(Math.random() * al.length)]; return s; }
function nm(u) { return S.players[u] ? esc(S.players[u].name) : '?'; }
function store(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
function toast(msg) {
  ui.toast = msg; render(); clearTimeout(toastT);
  toastT = setTimeout(function () { ui.toast = ''; render(); }, 3500);
}

  }

}
var RULES = '<details class="card"><summary>게임 규칙</summary><ul>' +

function myWordChip(me) {

  return '<div class="mine"><span class="small muted">내 제시어</span><b>' + (ui.showWord ? esc(myWord) : '● ● ● ●') + '</b><button type="button" class="small" data-act="toggleWord">' + (ui.showWord ? '숨기기' : '보기') + '</button></div>';

  if (!others.length) return '';
  var h = '<details class="card"><summary>방 관리 (방장)</summary><p class="small muted">연결이 끊겨 진행이 멈췄을 때 해당 플레이어를 퇴장시킬 수 있어요.</p><div class="chips">';
  others.forEach(function (u) {
    h += '<button type="button" class="small danger" data-act="kick" data-u="' + esc(u) + '">' + (ui.confirmKick === u ? '정말 퇴장? 한 번 더 누르세요' : nm(u) + ' 퇴장') + '</button>';
  });
  return h + '</div></details>';
}

function playView(me) {
  var h = turnBanner();
  h += myWordChip(me);
  h += pendingPanel();
  if (me && me.alive && S.turn === uid && !S.pending) h += actPanel(me);
  h += playersGrid() + logView();
  if (S.host === uid) h += adminPanel();
  return h;
}

function endedView(me) {
  var h = '<div class="banner end"><h2>' + (S.winner ? nm(S.winner) + '님의 승리!' : '승자 없이 끝났어요') + '</h2><p class="small">마지막까지 살아남은 한 명이에요.</p></div>';
  h += '<section class="card"><h3>제시어 공개</h3><ul class="plist">';
  S.order.forEach(function (u) {
    var p = S.players[u]; if (!p) return;
    h += '<li><span class="nm">' + nm(u) + '</span><span>' + (p.word ? esc(p.word) : '…') + '</span>' + (u === S.winner ? '<span class="badge on">승</span>' : '') + '</li>';
  });
  h += '</ul></section>' + logView() + '<button type="button" class="primary" data-act="leave">처음으로</button>';
  return h;
}

function roomView() {
  var head = roomHead();
  if (!loaded) {
    return head + '<section class="card"><p class="muted">방에 접속하는 중이에요…</p>' + (ui.slow ? '<p class="small">연결이 느려요. 네트워크 상태를 확인해 주세요.</p>' : '') + '</section>';
  }
  if (!S.exists) return head + '<section class="card"><h2>방을 찾을 수 없어요</h2><p class="muted">코드를 다시 확인해 주세요.</p><button type="button" data-act="leave">처음으로</button></section>';
  var me = S.players[uid];
  var body = S.phase === 'lobby' ? lobbyView(me) : S.phase === 'picking' ? pickingView(me) : S.phase === 'playing' ? playView(me) : endedView(me);
  return head + (S.phase !== 'lobby' && !me ? '<p class="small muted">관전 중이에요.</p>' : '') + body;
}

function view() {
  var h = '';
  if (conn.error === 'load') return brand() + '<section class="card warn"><h2>게임을 불러오지 못했어요</h2><p>index.html과 firebase-config.js가 같은 위치에 올라가 있는지, 그리고 광고 차단 프로그램이나 네트워크가 Google 서버(www.gstatic.com)를 막고 있지 않은지 확인해 주세요.</p><p class="small muted" style="overflow-wrap:anywhere">' + esc(conn.detail) + '</p></section>';
  if (conn.error === 'noconfig') return brand() + '<section class="card warn"><h2>Firebase 설정이 필요해요</h2><p>firebase-config.js에 Firebase 웹 앱 설정값을 넣어 주세요. 파일은 <b>export const firebaseConfig = {</b> 로 시작해야 하고, 그 안에 apiKey, authDomain, projectId, appId가 들어 있어야 해요. 자세한 순서는 DEPLOY.md에 있어요.</p></section>';
  if (conn.error === 'nodb') return brand() + '<section class="card warn"><h2>서버에 연결하지 못했어요</h2><p>네트워크 상태와 firebase-config.js의 설정값을 확인한 뒤 새로고침해 주세요.</p></section>';
  if (conn.error === 'noid') return brand() + '<section class="card warn"><h2>접속에 실패했어요</h2><p>Firebase 콘솔에서 익명 로그인이 켜져 있는지 확인해 주세요.</p></section>';
  if (!conn.ready) return brand() + '<section class="card"><p class="muted">연결하는 중이에요…</p></section>';
  if (conn.error === 'room') h += '<section class="card warn"><p>방과의 연결이 끊어졌어요. 페이지를 새로고침해 주세요.</p></section>';
  h += code ? roomView() : homeView();
  if (ui.toast) h += '<div class="toast" role="status">' + esc(ui.toast) + '</div>';
  return h;
}

/* ---------- rendering ---------- */
function render() {
  if (composing) { dirty = true; return; }
  var ae = document.activeElement, id = ae && ae.id, ss = null, se = null;
  if (id && ae.selectionStart != null) { ss = ae.selectionStart; se = ae.selectionEnd; }
  app.innerHTML = view();
  if (id) {
    var el = document.getElementById(id);
    if (el) { el.focus(); if (ss != null) { try { el.setSelectionRange(ss, se); } catch (e) {} } }
  }
}

/* ---------- room plumbing ---------- */
function emit(ev) {
  if (!col) return Promise.resolve();
  var thisCol = col;
  writeChain = writeChain.then(function () {
    var payload = Object.assign({ u: uid, n: events.length + 1, ts: serverTimestamp() }, ev);
    return addDoc(thisCol, payload);
  }).catch(function () { toast('전송하지 못했어요. 다시 시도해 주세요.'); });
  return writeChain;
}

function loadWord(c) {
  getDoc(doc(fs, 'users', uid, 'words', c)).then(function (s) {
    if (c !== code) return;
    myWord = s.exists() && s.data() ? (s.data().word || null) : null;
    onState();
  }).catch(function () {});
}

function toEvent(d) {
  var o = Object.assign({}, d.data());
  o.id = d.id;
  // order by the server's clock; my own not-yet-confirmed writes go last
  o.ts = d.metadata.hasPendingWrites ? Number.MAX_SAFE_INTEGER : (o.ts && o.ts.toMillis ? o.ts.toMillis() : 0);
  return o;
}

function enterRoom(c, opts) {
  if (unsub) { unsub(); unsub = null; }
  code = c; ctx = opts || {}; events = []; S = newState(); loaded = false; myWord = null; sent = new Set();
  ui.opts = null; ui.slow = false; ui.showWord = false; ui.confirmKick = null; ui.text = ''; conn.error = conn.error === 'room' ? null : conn.error;
  col = collection(fs, 'rooms', c, 'events');
  try { location.hash = 'r-' + c; } catch (e) {}
  store('five:room', c);
  clearTimeout(slowT);
  slowT = setTimeout(function () { if (!loaded) { ui.slow = true; render(); } }, 10000);
  unsub = onSnapshot(col, function (snap) {
    events = snap.docs.map(toEvent);
    S = reduce(events);
    if (!snap.metadata.fromCache) { loaded = true; ui.slow = false; clearTimeout(slowT); }
    onState();
  }, function () { conn.error = 'room'; render(); });
  loadWord(c);
  render();
}

function leaveRoom() {
  if (unsub) { unsub(); unsub = null; }
  clearTimeout(slowT);
  code = null; col = null; loaded = false; S = newState(); events = []; myWord = null; ctx = {};
  try { location.hash = ''; } catch (e) {}
  store('five:room', null);
  render();
}

function ensureCtx() {
  if (!loaded) return false;
  if (ctx.createAs) {
    var n = ctx.createAs; ctx.createAs = null;
    if (!S.exists) emit({ t: 'create', code: code, name: n, topic: { key: 'animal', label: '동물' } });
    else if (S.host !== uid) { enterRoom(genCode(), { createAs: n }); return true; }
  }
  if (ctx.joinAs) {
    var j = ctx.joinAs; ctx.joinAs = null;
    if (S.exists && !S.players[uid] && S.phase === 'lobby') {
      if (S.joined.length >= MAX_PLAYERS) toast('방이 가득 찼어요.');
      else emit({ t: 'join', name: j });
    }
  }
  return false;
}

function autoActions() {
  if (!S.exists || !uid) return;
  var me = S.players[uid], pd = S.pending;
  if (pd && pd.type === 'guess' && pd.to === uid && myWord && !sent.has(pd.id) && norm(pd.text) === norm(myWord)) {
    sent.add(pd.id);
    emit({ t: 'verdict', correct: true, word: myWord });
  }
  if (me && me.word == null && myWord && (!me.alive || S.phase === 'ended') && !sent.has('reveal')) {
    sent.add('reveal');
    emit({ t: 'reveal', word: myWord });
  }
}

function onState() {
  if (ensureCtx()) return;
  render();
  autoActions();
}

function setWord(w) {
  w = clean(w, 30);
  if (!w) { toast('제시어를 입력하거나 골라 주세요.'); return; }
  var c = code;
  setDoc(doc(fs, 'users', uid, 'words', c), { word: w, ts: Date.now() }).then(function () {
    if (c !== code) return;
    myWord = w; ui.custom = ''; ui.showWord = true;
    emit({ t: 'ready' }); render();
  }).catch(function () { toast('제시어를 저장하지 못했어요. 권한을 확인해 주세요.'); });
}

function submitAct() {
  var me = S.players[uid];
  if (!me || S.turn !== uid || S.pending) return;
  var fin = me.ap < 1, mode = fin ? 'guess' : ui.mode, text = clean(ui.text, 80);
  if (!ui.target || !S.players[ui.target] || !S.players[ui.target].alive) { toast('대상을 골라 주세요.'); return; }
  if (!text) { toast(mode === 'ask' ? '질문을 입력해 주세요.' : '정답을 입력해 주세요.'); return; }
  ui.text = '';
  emit({ t: mode, to: ui.target, text: text });
  render();
}

function myName() {
  var n = clean(ui.name, 8);
  if (!n) { toast('닉네임을 입력해 주세요.'); return null; }
  store('five:name', n);
  return n;
}

function act(a, b) {
  switch (a) {
    case 'create': { var n = myName(); if (n) enterRoom(genCode(), { createAs: n }); return; }
    case 'joinHere': { var n2 = myName(); if (n2) emit({ t: 'join', name: n2 }); return; }
    case 'leave': leaveRoom(); return;
    case 'copyLink':
      try { navigator.clipboard.writeText(location.href).then(function () { toast('링크를 복사했어요.'); }, function () { toast('주소창의 링크를 복사해 주세요.'); }); }
      catch (e) { toast('주소창의 링크를 복사해 주세요.'); }
      return;
    case 'copy':
      try { navigator.clipboard.writeText(code).then(function () { toast('코드를 복사했어요.'); }, function () { toast('코드: ' + code); }); }
      catch (e) { toast('코드: ' + code); }
      return;
    case 'topic': emit({ t: 'topic', key: b.getAttribute('data-key'), label: PRESETS[b.getAttribute('data-key')].label }); return;
    case 'start': emit({ t: 'start', order: shuffle(S.joined.slice()) }); return;
    case 'kick': {
      var u = b.getAttribute('data-u');
      if (S.phase === 'lobby' || ui.confirmKick === u) { ui.confirmKick = null; emit({ t: 'kick', target: u }); render(); }
      else { ui.confirmKick = u; render(); }
      return;
    }
    case 'pickOpt': setWord(ui.opts[+b.getAttribute('data-i')]); return;
    case 'reroll': ui.opts = shuffle(PRESETS[S.topic.key].pool.slice()).slice(0, 3); render(); return;
    case 'mode': ui.mode = b.getAttribute('data-m'); render(); return;
    case 'target': ui.target = b.getAttribute('data-u'); render(); return;
    case 'answer': emit({ t: 'answer', yes: b.getAttribute('data-yes') === '1' }); return;
    case 'verdict': {
      var ok = b.getAttribute('data-ok') === '1', ev = { t: 'verdict', correct: ok };
      if (ok && myWord) ev.word = myWord;
      emit(ev); return;
    }
    case 'toggleWord': ui.showWord = !ui.showWord; render(); return;
  }
}

function form(f) {
  if (f === 'join') {
    var c = clean(ui.codeIn, 4).toUpperCase();
    if (c.length !== 4) { toast('방 코드는 4글자예요.'); return; }
    var n = myName(); if (n) { ui.codeIn = ''; enterRoom(c, { joinAs: n }); }
  } else if (f === 'topicCustom') {
    var lab = clean(ui.topicIn, 16);
    if (!lab) { toast('주제를 입력해 주세요.'); return; }
    emit({ t: 'topic', key: 'custom', label: lab });
  } else if (f === 'word') setWord(ui.custom);
  else if (f === 'act') submitAct();
}

app.addEventListener('click', function (e) {
  var b = e.target.closest ? e.target.closest('[data-act]') : null;
  if (b && !b.disabled) act(b.getAttribute('data-act'), b);
});
app.addEventListener('submit', function (e) { e.preventDefault(); form(e.target.getAttribute('data-form')); });
app.addEventListener('input', function (e) {
  var t = e.target;
  if (t && t.id && Object.prototype.hasOwnProperty.call(ui, t.id) && 'value' in t) ui[t.id] = t.value;
});
app.addEventListener('compositionstart', function () { composing = true; });
app.addEventListener('compositionend', function (e) {
  composing = false;
  var t = e.target;
  if (t && t.id && Object.prototype.hasOwnProperty.call(ui, t.id) && 'value' in t) ui[t.id] = t.value;
  if (dirty) { dirty = false; render(); }
});

/* ---------- boot ---------- */
if (!loadError) render();
(async function () {
  window.__fiveStarted = true;
  if (loadError) {
    if (location.protocol === 'file:') return;
    conn.error = 'load'; conn.detail = String((loadError && loadError.message) || loadError); render(); return;
  }
  if (!firebaseConfig || !firebaseConfig.apiKey || /^YOUR/.test(firebaseConfig.apiKey)) { conn.error = 'noconfig'; render(); return; }
  try {
    var fbApp = initializeApp(firebaseConfig);
    fs = initializeFirestore(fbApp, { experimentalAutoDetectLongPolling: true });
    auth = getAuth(fbApp);
  } catch (e) { conn.error = 'nodb'; render(); return; }
  try {
    var cred = await signInAnonymously(auth);
    uid = cred.user.uid;
  } catch (e) { conn.error = 'noid'; render(); return; }
  conn.ready = true;
  try { ui.name = localStorage.getItem('five:name') || ''; } catch (e) {}
  var m = (location.hash || '').match(/^#r-([A-Za-z0-9]{4})$/), saved = null;
  try { saved = localStorage.getItem('five:room'); } catch (e) {}
  var c = m ? m[1].toUpperCase() : (saved && /^[A-Z0-9]{4}$/.test(saved) ? saved : null);
  if (c) enterRoom(c, {}); else render();
})();
})();
</script>
</body>
</html>
